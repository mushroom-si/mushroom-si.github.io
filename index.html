<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Studio</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            line-height: 1.6; 
            max-width: 600px; 
            margin: 50px auto; 
            padding: 0 20px; 
            color: #333; 
        }
        h1 { 
            font-weight: 300; 
            letter-spacing: -0.5px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 15px; 
            margin-bottom: 30px; 
        }
        h2 { 
            font-weight: 500; 
            font-size: 1.2rem; 
            margin: 0 0 5px 0; 
        }
        p.desc { 
            color: #666; 
            font-size: 0.95rem; 
            margin-top: 0; 
            margin-bottom: 15px; 
        }
        .app-card { 
            background: #fafafa; 
            padding: 25px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #f0f0f0;
        }
        .links a { 
            display: inline-block; 
            margin-right: 15px; 
            color: #007aff; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 500;
        }
        .links a:hover { 
            text-decoration: underline; 
        }
    </style>
</head>
<body>
    <h1>App Studio</h1>
    <p style="margin-bottom: 40px;">Simple & Modern 감성을 담은 글로벌 애플리케이션을 만듭니다.</p>

    <!-- Onlayer 앱 섹션 -->
    <div class="app-card">
        <h2>Onlayer</h2>       
        <div class="links">
            <a href="./onlayer/ko/">🇰🇷 한국어 지원 (Korean)</a>
            <a href="./onlayer/en/">🇺🇸 English Support</a>
        </div>
    </div>    
</body>
</html>
